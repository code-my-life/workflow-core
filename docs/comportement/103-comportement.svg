xt x="902.0" y="284" fill="#e6edf3" font-size="13">sessions lues</text><text x="902.0" y="301" fill="#adbac7" font-size="11">transcript, sessionId et work présents</text><text x="1220.0" y="276" fill="#57ab5a" font-size="10" text-anchor="end">nouveau</text><path d="M350.0,140 C368.0,153.0 368.0,153.0 350.0,166" fill="none" stroke="#768390" stroke-width="2" marker-end="url(#anormal)"/><text x="372.0" y="157.0" fill="#768390" font-size="10">ouvre</text><path d="M350.0,262 C368.0,249.0 368.0,249.0 350.0,236" fill="none" stroke="#e5534b" stroke-width="2" marker-end="url(#arefus)"/><text x="372.0" y="253.0" fill="#e5534b" font-size="10">réutilise</text><path d="M350.0,236 C368.0,297.0 368.0,297.0 350.0,358" fill="none" stroke="#768390" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#apointille)"/><path d="M1190.0,140 C1208.0,201.0 1208.0,201.0 1190.0,262" fill="none" stroke="#768390" stroke-width="2" marker-end="url(#anormal)"/><path d="M1190.0,236 C1208.0,249.0 1208.0,249.0 1190.0,262" fill="none" stroke="#768390" stroke-width="2" marker-end="url(#anormal)"/><text x="20" y="494" fill="#768390" font-size="11">rôles : existant  nouveau  retire  trou  refus  note ; lien rouge : refus ; pointillé : potentiel</text></svg>
