<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="504" font-family="-apple-system, Segoe UI, sans-serif"><defs><marker id="anormal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#768390"/></marker><marker id="apointille" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#768390"/></marker><marker id="arefus" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e5534b"/></marker></defs><rect width="100%" height="100%" fill="#22272e"/><rect x="20" y="20" width="400" height="444" rx="10" fill="#1c2128" stroke="#444c56"/><text x="220.0" y="48" fill="#cdd9e5" font-size="13" font-weight="600" text-anchor="middle">Aujourd&#x27;hui : une connexion par agent, gardée</text><rect x="50.0" y="70" width="340" height="70" rx="8" fill="#2d333b" stroke="#768390" stroke-width="2"/><text x="62.0" y="92" fill="#e6edf3" font-size="13">1re requête</text><text x="62.0" y="109" fill="#adbac7" font-size="11">thread A</text><text x="380.0" y="84" fill="#768390" font-size="10" text-anchor="end">existant</text><rect x="50.0" y="166" width="340" height="70" rx="8" fill="#2d333b" stroke="#768390" stroke-width="2"/><text x="62.0" y="188" fill="#e6edf3" font-size="13">connexion state.db</text><text x="62.0" y="205" fill="#adbac7" font-size="11">ouverte et gardée par le thread A</text><text x="380.0" y="180" fill="#768390" font-size="10" text-anchor="end">existant</text><rect x="50.0" y="262" width="340" height="70" rx="8" fill="#2d333b" stroke="#768390" stroke-width="2"/><text x="62.0" y="284" fill="#e6edf3" font-size="13">requête suivante</text><text x="62.0" y="301" fill="#adbac7" font-size="11">thread B</text><text x="380.0" y="276" fill="#768390" font-size="10" text-anchor="end">existant</text><rect x="50.0" y="358" width="340" height="70" rx="8" fill="#5d2f00" stroke="#e0823d" stroke-width="2"/><text x="62.0" y="380" fill="#e6edf3" font-